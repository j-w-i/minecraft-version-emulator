org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.1 — the target this project is being moved to, so that Nostalgic Tweaks' own
# 1.21.1/1.21.4 code can be copied in rather than adapted line by line.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10
fabric_version=0.116.5+1.21.1

# Same Moderner Beta line as the 26.3 work used (5.0.0-alpha.4), so the integration code and the preset
# ids carry across rather than being rediscovered.
moderner_beta_version=5.0.0-alpha.4+1.21.1-fabric

mod_version=0.1.0
maven_group=net.historicalexperience
archives_base_name=historical-experience-1211

# Mod Menu 11.0.5 for 1.21/1.21.1 - confirmed the newest release that supports this game version, and the
# exact build the owner already has installed in their instance, so the entrypoint is picked up with no
# extra setup. Compile-only: see build.gradle for why this must not become a hard dependency.
modmenu_version=11.0.5
