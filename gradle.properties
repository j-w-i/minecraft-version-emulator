org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 1.21.1 — the target this project is being moved to, so that Nostalgic Tweaks' own
# 1.21.1/1.21.4 code can be copied in rather than adapted line by line.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10
fabric_version=0.116.5+1.21.1

# Same Moderner Beta line as the 26.3 work used (5.0.0-alpha.4), so the integration code and the preset
# ids carry across rather than being rediscovered.
moderner_beta_version=5.0.0-alpha.4+1.21.1-fabric

mod_version=0.1.0
maven_group=net.historicalexperience
archives_base_name=historical-experience-1211

# SPDX identifier for the project as a whole. This project's own contributions are
# LGPL-3.0-or-later. Portions copied or adapted from Nostalgic Tweaks are LGPL-3.0-only, because
# upstream's LICENSE.txt carries no "or any later version" election (see THIRD_PARTY_NOTICES.md).
mod_license=LGPL-3.0-or-later

# Authoring identity used by published metadata. No individual's name is asserted.
mod_authors=Minecraft Historical Experience contributors
# Where the Corresponding Source for a published build can be obtained. The repository is PRIVATE at
# the time of writing: publishing a jar (especially on Modrinth/CurseForge) while this remains private
# does NOT satisfy LGPL-3.0 section 4/6 source-availability. See docs/LICENSING.md "Before you publish".
mod_source=https://github.com/j-w-i/minecraft-version-emulator

# Mod Menu 11.0.5 for 1.21/1.21.1 - confirmed the newest release that supports this game version, and the
# exact build the owner already has installed in their instance, so the entrypoint is picked up with no
# extra setup. Compile-only: see build.gradle for why this must not become a hard dependency.
modmenu_version=11.0.5
